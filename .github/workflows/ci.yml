name: Docker Build, Test, and Push

on:
  push:
    branches: [ docker_ci ]

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run training script to generate model
        # This step is essential because the Dockerfile needs the model file to exist
        run: python src/train.py

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mlops-a3-housing:latest .

      - name: Run container to test model
        # This step executes the verification script. If it fails, the workflow stops.
        run: docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/mlops-a3-housing:latest

      - name: Push Docker image to Docker Hub
        # This step only runs if the 'docker run' test above succeeds.
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/mlops-a3-housing:latest